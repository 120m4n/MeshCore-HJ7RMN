; EbyteMesh: Ebytastic PCB (Pro Micro nRF52840 + Ebyte E22-900M30S / E22-900M33S)
; Pinout identical to the faketec/ProMicro variant -> reuses variants/promicro (variant.h/.cpp, PromicroBoard).
; Board is powered from external 5 V only - do not connect USB and 5 V at the same time.
; Build:  pio run -e EbyteMesh_repeater | EbyteMesh_companion_radio_usb | EbyteMesh_companion_radio_ble
; Flash:  python bin/uf2conv/uf2conv.py .pio/build/<env>/firmware.hex -c -f 0xADA52840 -o firmware.uf2
;         double-tap RST, copy firmware.uf2 to the UF2 drive.

; ---- E22 module selection: keep ONE line uncommented ----
[ebytemesh_module]
build_flags =
; E22-900M30S: SX1262 at 22 dBm -> ~30 dBm out
;  -D LORA_TX_POWER=22
; E22-900M33S: SX1262 must stay <= 9 dBm (datasheet) -> 8 dBm in ~ 33 dBm out
  -D LORA_TX_POWER=8 -D MAX_LORA_TX_POWER=8

[EbyteMesh]
extends = nrf52_base
board = promicro_nrf52840
build_flags = ${nrf52_base.build_flags}
  ${ebytemesh_module.build_flags}
  -I variants/ebytemesh
  -I variants/promicro
  -D PROMICRO
  -D EBYTEMESH
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=EbyteMeshRadioWrapper
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_BOARD_SCL=7
  -D PIN_BOARD_SDA=8
  -D PIN_OLED_RESET=-1
  -D PIN_USER_BTN=6
  -D PIN_GPS_RX=3
  -D PIN_GPS_TX=4
  -D PIN_GPS_EN=5
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/sensors>
  +<../variants/promicro/variant.cpp>
  +<../variants/promicro/PromicroBoard.cpp>
  +<../variants/ebytemesh>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps = ${Promicro.lib_deps}
  adafruit/RTClib @ ^2.1.3

[env:EbyteMesh_repeater]
extends = EbyteMesh
build_src_filter = ${EbyteMesh.build_src_filter}
  +<../examples/simple_repeater>
build_flags = ${EbyteMesh.build_flags}
  -D ADVERT_NAME='"EbyteMesh Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D DISPLAY_CLASS=SSD1306Display

[env:EbyteMesh_companion_radio_usb]
extends = EbyteMesh
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${EbyteMesh.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D ENABLE_USB_INTERFACE
build_src_filter = ${EbyteMesh.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${EbyteMesh.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:EbyteMesh_companion_radio_ble]
extends = EbyteMesh
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${EbyteMesh.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=SSD1306Display
build_src_filter = ${EbyteMesh.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${EbyteMesh.lib_deps}
  densaugeo/base64 @ ~1.4.0
