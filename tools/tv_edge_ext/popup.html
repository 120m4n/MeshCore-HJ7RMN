<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MeshCore TV Decoder</title>
<style>
  :root {
    --bg:#f1f1ee; --surface:#fcfcfb; --ink:#1a1a19; --ink-2:#5c5c58; --grid:#0000001a; --line:#0000002b;
    --series:#2a6fdb; --on-series:#fff; --series-tint:#2a6fdb1a;
    --warn-bg:#fff4d6; --warn-ink:#7a4b00; --err-bg:#fde8e8; --err-ink:#9b1c1c;
    --r:8px; --gap:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#121211; --surface:#1a1a19; --ink:#ececea; --ink-2:#a3a39e; --grid:#ffffff1f; --line:#ffffff2e;
      --series:#5a94ea; --on-series:#0c1a2e; --series-tint:#5a94ea26;
      --warn-bg:#3a2e10; --warn-ink:#ffd98a; --err-bg:#3b1717; --err-ink:#ffb4b4;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { font: 13px/1.4 system-ui, sans-serif; width: 560px; margin: 0; padding: 12px;
         background: var(--bg); color: var(--ink); display: flex; flex-direction: column; gap: var(--gap); }
  :focus-visible { outline: 2px solid var(--series); outline-offset: 2px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--gap); }

  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 15px; margin: 0; }
  .chip { padding: 2px 10px; border-radius: 99px; background: var(--series-tint); color: var(--ink);
          border: 1px solid var(--series); font-variant-numeric: tabular-nums; }

  textarea { width: 100%; height: 64px; resize: vertical; padding: 8px; font: 12px ui-monospace, monospace;
             background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; }
  textarea:focus { border-color: var(--series); }
  .row { display: flex; gap: 8px; align-items: center; margin-top: var(--gap); }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer;
           background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  button:hover:not(:disabled) { border-color: var(--series); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--series); color: var(--on-series); border-color: var(--series); font-weight: 600; }
  button[aria-pressed="true"] { background: var(--series-tint); border-color: var(--series); }
  label { margin-left: auto; display: flex; gap: 6px; align-items: center; cursor: pointer; }

  .banner { padding: 8px 10px; border-radius: var(--r); white-space: pre-wrap; }
  .banner::before { font-weight: 700; margin-right: 6px; }
  .banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .banner.warn::before { content: "⚠"; }
  .banner.err { background: var(--err-bg); color: var(--err-ink); }
  .banner.err::before { content: "✕"; }
  .empty { color: var(--ink-2); text-align: center; padding: 18px; }

  #charts { position: relative; }
  #charts:empty { display: none; }
  #charts svg { font-size: 11px; display: block; }
  .t-ink { fill: var(--ink); } .t-mute { fill: var(--ink-2); }
  .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
  .grid { stroke: var(--grid); }
  .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; }
  .dot { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
  .mean { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 4 3; }
  .ext { fill: var(--surface); stroke: var(--series); stroke-width: 2; }
  .cross { stroke: var(--ink-2); stroke-width: 1; }
  .tip { position: absolute; top: 8px; pointer-events: none; white-space: pre; padding: 4px 8px;
         background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; }

  .tbl-wrap { padding: 0; max-height: 220px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th { position: sticky; top: 0; background: var(--surface); color: var(--ink-2); font-size: 11px;
       text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
  th, td { padding: 4px 10px; text-align: right; }
  td:last-child, th:last-child { text-align: left; }
  tbody tr:nth-child(even) { background: var(--grid); }
  tbody tr:hover { background: var(--series-tint); }

  #panel { display: flex; flex-direction: column; gap: var(--gap); }
  .tabs { display: flex; gap: 6px; overflow-x: auto; }
  .tabs button { white-space: nowrap; border-radius: 99px; padding: 3px 12px; }
  .tabs button[aria-selected="true"] { background: var(--series-tint); border-color: var(--series); font-weight: 600; }
  .next { display: flex; align-items: center; gap: 8px; }
  .next span { color: var(--ink-2); }
  .next code { font: 13px ui-monospace, monospace; padding: 2px 8px; border-radius: 4px; background: var(--bg); }
  .next button { margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>MeshCore TV Decoder</h1>
  <span id="info" class="chip" hidden></span>
</header>
<section class="card">
  <textarea id="in" aria-label="Salida de tv 0" placeholder="Pega la salida de `tv 0` (una línea por página)"></textarea>
  <div class="row">
    <button id="go" class="primary">Decodificar</button>
    <button id="toggle" aria-pressed="true">Gráficas: on</button>
    <button id="csv" disabled>Copiar CSV</button>
    <label><input type="checkbox" id="local"> hora local</label>
  </div>
</section>
<div id="empty" class="empty">Pega la salida de <code>tv 0</code> y pulsa Decodificar.</div>
<div id="err" class="banner err" role="alert" hidden></div>
<div id="warn" class="banner warn" hidden></div>
<div id="tabs" class="tabs" role="tablist" aria-label="Líneas decodificadas" hidden></div>
<div id="panel" role="tabpanel" hidden>
  <section id="charts" class="card"></section>
  <section class="card tbl-wrap"><table id="tbl"><thead></thead><tbody></tbody></table></section>
  <section class="card next">
    <span>Siguiente consulta</span><code id="next"></code><button id="copynext">Copiar</button>
  </section>
</div>
<script src="popup.js"></script>
</body>
</html>
