<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MeshCore TV Decoder</title>
<style>
  :root { --surface:#fcfcfb; --ink:#1a1a19; --ink-2:#5c5c58; --grid:#0000001a; --series:#2a6fdb; }
  @media (prefers-color-scheme: dark) {
    :root { --surface:#1a1a19; --ink:#ececea; --ink-2:#a3a39e; --grid:#ffffff1f; --series:#5a94ea; }
  }
  body { font: 13px system-ui, sans-serif; width: 560px; margin: 12px; background: var(--surface); color: var(--ink); }
  #charts { position: relative; margin: 8px 0; }
  #charts svg { font-size: 11px; display: block; }
  .t-ink { fill: var(--ink); } .t-mute { fill: var(--ink-2); }
  .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
  .grid { stroke: var(--grid); }
  .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; }
  .dot { fill: var(--series); stroke: var(--surface); stroke-width: 2; }
  .mean { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 4 3; }
  .cross { stroke: var(--ink-2); stroke-width: 1; }
  .tip { position: absolute; top: 0; pointer-events: none; white-space: pre; padding: 4px 8px;
         background: var(--surface); color: var(--ink); border: 1px solid var(--grid); border-radius: 4px; }
  textarea, button { background: var(--surface); color: var(--ink); }
  textarea { width: 100%; height: 70px; box-sizing: border-box; font-family: monospace; }
  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 2px 6px; text-align: right; border-bottom: 1px solid #8884; }
  td:last-child, th:last-child { text-align: left; }
  #err { color: #c00; white-space: pre-wrap; }
  #next { font-family: monospace; }
</style>
</head>
<body>
<textarea id="in" placeholder="Pega la salida de `tv 0` (una línea por página)"></textarea>
<div class="row">
  <button id="go">Decodificar</button>
  <button id="csv" disabled>Copiar CSV</button>
  <label><input type="checkbox" id="local"> hora local</label>
</div>
<div id="err"></div>
<div id="info"></div>
<div id="charts"></div>
<table id="tbl" hidden><thead></thead><tbody></tbody></table>
<p id="next"></p>
<script src="popup.js"></script>
</body>
</html>
