; PlatformIO project for i2c_actuator_esp8266
;
; Test double for a PCF8574 I2C GPIO expander, running on a real
; ESP8266-12E NodeMCU dev board. See ../../README_I2C.md at the repo
; root for what this is for and how to wire it up, and this folder's
; own README.md for the ESP8266-specific pin map.
;
; This is a standalone PlatformIO project, independent of the main
; MeshCore firmware build (root platformio.ini) AND independent of
; ../i2c_actuator_nano (the Arduino Nano version of this same test
; double). Build/upload from inside this directory:
;
;   cd tools/i2c_actuator_esp8266
;   pio run -t upload
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
framework = arduino
board = nodemcuv2
monitor_speed = 115200
upload_speed = 115200
