; PlatformIO project for i2c_sensor_am2301_nano
;
; Real I2C bridge for an AM2301 (DHT21) temperature/humidity sensor,
; running on a real Arduino Nano (ATmega328P). See ../../README_I2C_SENSOR.md
; at the repo root for what this is for and how to wire it up.
;
; Unlike tools/i2c_actuator_nano (a test double for a real PCF8574 chip),
; this Nano IS the permanent bridge - the AM2301 has no native I2C
; interface, so a microcontroller reading it and re-exposing the reading
; over I2C is the production solution, not a bench-test stand-in.
;
; This is a standalone PlatformIO project, independent of the main
; MeshCore firmware build (root platformio.ini). Build/upload from
; inside this directory:
;
;   cd tools/i2c_sensor_am2301_nano
;   pio run -t upload            ; new-bootloader Nano (env:nano, default)
;   pio run -e nano_old_bootloader -t upload   ; old-bootloader Nano
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nano

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14

; Most Nano clones sold since ~2018 ship with the "new" bootloader
; (optiboot, 115200 baud upload). This is the one to try first.
[env:nano]
board = nanoatmega328new

; Older/genuine Nanos (or clones with the original bootloader) use the
; "old" bootloader (57600 baud upload). If `pio run -t upload` with the
; env above fails to sync, try this env instead.
[env:nano_old_bootloader]
board = nanoatmega328
